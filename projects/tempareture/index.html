<!-- @format -->

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link href="style.css" rel="stylesheet" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <main
      class="bg-success vh-100 d-flex align-items-center justify-content-center bg-gradient"
    >
      <div class="card shadow-lg" style="width: 22rem">
        <div class="child_card card-body">
          <form id="tempaCalc" onsubmit="calculateTem(); return false">
            <div class="form-group">
              <input
                type="number"
                name="tempName"
                class="form-control mb-2"
                id="temp"
              />
              <select
                name="tempOptions"
                class="form-control mb-2"
                id="tempChoose"
              >
                <option value="cel">celsius</option>
                <option value="fah">fahrenheit</option>
              </select>
            </div>
            <button class="btn btn-primary shadow-sm">Submit</button>
            <span id="result"> </span>
          </form>
        </div>
      </div>
    </main>
    <script>
      const calculateTem = (e) => {
        const tempNum = document.getElementById("temp").value;

        const tempOptions = document.getElementById("tempChoose");
        const valueTempOptions =
          tempChoose.options[tempOptions.selectedIndex].value;

        console.log(tempNum, valueTempOptions);

        const celToFah = (celValue) => {
          let fahrenheitValue = Math.round(((celValue - 32) * 5) / 9);
          return fahrenheitValue;
        };

        const fahToCel = (fahValue) => {
          let celciousValue = Math.round((fahValue * 9) / 5 + 32);
          return celciousValue;
        };

        let resultRes;
        if (valueTempOptions == "cel") {
          resultRes = celToFah(tempNum);
          document.getElementById("result").innerHTML = `${resultRes} celsius`;
        } else {
          resultRes = fahToCel(tempNum);
          document.getElementById(
            "result"
          ).innerHTML = `${resultRes} fahrenheit`;
        }
      };
    </script>
  </body>
</html>
